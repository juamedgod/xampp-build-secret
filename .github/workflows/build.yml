                https://github.com/ApacheFriends/web/releases/download/20261104/xampp-htdocs-linux-20261104.tar.gz 7fec3bf27310d4c708b7cde4ebbaf0e284ec582d6d634590a37d97bd619e6e2c
                https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.zip 2d2e13c735366d318425c78e4ee2cc8fc648d77faba3ddea2cd516e43885733f

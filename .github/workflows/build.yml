            base_tarball: "https://github.com/juamedgod/xampp-build-secret/releases/download/tarballs%2F20261107/xampp83-linux-x64-20261106.tar.gz"
            base_tarball_sha256: "7ab60efa0e000cc21fa90d7fe61e73e08d3f876c8ce3bf403fa5bc804550d3ce"
            extra_binaries: |
                https://sourceforge.net/projects/xampp/files/thirdparties/20261103/curl-ca-bundle-2026-11-05.crt 427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285
                https://github.com/ApacheFriends/web/releases/download/20261104/xampp-htdocs-linux-20261104.tar.gz 7fec3bf27310d4c708b7cde4ebbaf0e284ec582d6d634590a37d97bd619e6e2c
                https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.zip 2d2e13c735366d318425c78e4ee2cc8fc648d77faba3ddea2cd516e43885733f
                https://sourceforge.net/projects/xampp/files/xampp-skeleton/xampp-skeleton-dev-unix-1.8.6-12.tar.gz 0e0f4a4da3bacfcf2539a62cd23c056e3851d3b375c44b22ff4182db67ad1819

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup /bitnami dir
        id: setup-bitnami-dir
        run: |
          sudo mkdir /bitnami
          sudo chown "$USER:$USER" /bitnami
      - name: Get base tarball filename
        id: base_tarball
        env:
          URL: ${{ matrix.base_tarball }}
        run: |
          echo "filename=$(basename "${URL%%\?*}")" >> "$GITHUB_OUTPUT"
      - name: Restore base tarball cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/tarballs/${{ steps.base_tarball.outputs.filename }}
          key: base-tarball-${{ matrix.base_tarball_sha256 }}

      - name: Cache tarballs
        id: cache-tarballs
        uses: actions/cache@v5
        with:
          path: /tmp/tarballs
          key: tarballs-${{ matrix.os }}-${{ hashFiles('.github/workflows/*') }}

      - name: Install tclkit
        id: install-tclkit
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -L -o tclkit 'https://tclkits.rkeene.org/fossil/raw/tclkit-8.5.17-rhel5-x86_64?name=76a197fe41359daaf4f90a2001f46675b3667e26'
          chmod 755 tclkit
          sudo mv tclkit /usr/local/bin
      - name: Cache InstallBuilder
        id: cache-installbuilder
        uses: actions/cache@v5
        with:
          path: /opt/installbuilder.run
          key: ${{ env.IB_SHA256 }}

      - name: Install InstallBuilder
        id: install-ib
        run: |
          set -euo pipefail
          cd /opt/
          if [[ ! -f "/opt/installbuilder.run" ]]; then
            echo "Downloading InstallBuilder"
            curl --fail --show-error --silent -L -o installbuilder.run "https://releases.installbuilder.com/installbuilder/installbuilder-professional-${{ env.IB_VERSION }}-linux-x64-installer.run"
          else
             echo "Using cached InstallBuilder"
          fi
          echo "${{ env.IB_SHA256 }}  installbuilder.run" | sha256sum -c -
          chmod 755 installbuilder.run
          sudo ./installbuilder.run --mode unattended --prefix /opt/installbuilder
          sudo chown -R "$USER:$USER" /opt/installbuilder
          ln -sf /opt/installbuilder ~/installbuilder-${{env.IB_VERSION}}
          echo "${{env.IB_VERSION}}" > /opt/installbuilder/ibversion

      - name: Register License
        id: register-license
        env:
          LICENSE_TEXT: ${{ secrets.INSTALLBUILDER_LICENSE }}
        run: |
          echo "$LICENSE_TEXT" > /opt/installbuilder/license.xml
          /opt/installbuilder/bin/builder check-license
      - name: Get tarballs
        id: get-tarballs
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/tarballs
          cd /tmp/tarballs/
          BASE_FILE=$(basename '${{ matrix.base_tarball }}')
          if [[ ! -f "/tmp/tarballs/$BASE_FILE" ]]; then
            echo "Downloading base tarball..."
            curl --fail --show-error --silent --retry 3 -L \
              -O '${{ matrix.base_tarball }}'
          else
            echo "Found local file $BASE_FILE"
          fi
          echo "${{ matrix.base_tarball_sha256 }}  $BASE_FILE" | sha256sum -c -
          # Windows expects the contents of the base file
          if [[ "${{matrix.os}}" == "windows-x64" ]]; then
            echo "Extracting $BASE_FILE ..."
            tar -xzf "$BASE_FILE"
          fi
          echo "Downloading extra binaries..."
          while read -r url sha; do
            [ -z "$url" ] && continue
            echo "  -> $url"
            curl --fail --show-error --silent --retry 3 -L -O "$url"
            echo "$sha  $(basename "$url")" | sha256sum -c -
          done <<< "${{ matrix.extra_binaries }}"
      - name: Build
        id: build
        run: |
          set -euo pipefail
          cd src
          if [[ "${{matrix.os}}" == "windows-x64" ]]; then
             tclkit createstack.tcl pack xamppinstaller${{matrix.version}}stack ${{matrix.os}}
          else
             tclkit createstack.tcl pack xamppunixinstaller${{matrix.version}}stack ${{matrix.os}}
          fi
          mkdir /bitnami/dist-${{matrix.version}}-${{matrix.os}}
          mv /opt/installbuilder/output/* /bitnami/dist-${{matrix.version}}-${{matrix.os}}
      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xampp-${{matrix.version}}-${{matrix.os}}
          path: |
            /bitnami/dist-${{matrix.version}}-${{matrix.os}}/*
  publish:
    needs: build-xampp
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/**/xampp-*
          token: ${{ github.token }}
          fail_on_unmatched_files: true
